app = "korapay-api"
primary_region = "dfw"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT = "3061"

[http_service]
  internal_port = 3061
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[deploy]
  release_command = "npx prisma migrate deploy --schema=prisma/schema.prisma"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
